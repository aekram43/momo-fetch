[package]
name = "momo-fetch"
version = "1.0.0"
edition = "2024"
rust-version = "1.85.0"
description = "Rust-native AI agent workspace with EverMemOS memory vault"
license = "MIT"

[dependencies]
# Agent framework
adk-rust = { version = "0.7.0", features = [
    "anthropic", "gemini", "models", "tools", "sessions",
    "runner", "agents", "skills"
] }
adk-model = { version = "0.7.0", features = [
    "openai", "anthropic", "deepseek", "ollama", "groq", "openrouter"
] }
adk-tool = { version = "0.7", features = ["http-transport"] }
adk-session = { version = "0.7.0", features = ["sqlite"] }
schemars = "0.8"

# Async runtime
tokio = { version = "1", features = ["full"] }

# CLI
clap = { version = "4", features = ["derive"] }
rustyline = "18"
colored = "2"
rpassword = "7"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Memory vault
pulldown-cmark = "0.13"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

# Filesystem
ignore = "0.4"
walkdir = "2"
path-clean = "0.1"
tempfile = "3"

# Networking
reqwest = { version = "0.13", features = ["json", "rustls"] }

# Configuration & secrets
# Keychain: see the per-target `keyring` entries near the bottom of this file.
dotenvy = "0.15"
dirs = "6"

# System
libc = "0.2"
anyhow = "1"
glob = "0.3"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Gateway (HTTP server)
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs"] }
async-stream = "0.3"
futures = "0.3"

[dev-dependencies]
tokio-test = "0.4"
assert_cmd = "2"
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1

# Patch rmcp to handle 200 OK with no Content-Type (some MCP servers
# return this for notifications instead of 202 Accepted).
[patch.crates-io]
rmcp = { path = "patches/rmcp-1.6.0" }

# OS keychain.
#
# `keyring`, not `keyring-core`. keyring-core is the abstract half and ships
# only `mock` and `sample` stores — with it every `Entry::new` failed with
# "No default store has been set", so the keychain never worked at all and
# `.env` was the only path that did. keyring 3.x bundles the real platform
# backends.
#
# Split per target rather than enabling every backend at once: the Linux
# feature pulls dbus, which has no business being a macOS build dependency.

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }
