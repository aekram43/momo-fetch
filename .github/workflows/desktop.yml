name: Desktop build

# T10 — build the desktop app for macOS, Windows and Linux.
#
# The momo-fetch binary is compiled per target and copied into
# desktop/src-tauri/binaries/ so Tauri bundles it as a resource. There is no
# cross-compilation: each OS builds its own, which is also the only way the
# native webview and bundler dependencies work.
#
# Unsigned by design until T13 lands — see the note at the bottom of the job.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target\ndesktop/src-tauri -> target"

      # Tauri's Linux dependencies. Not needed on macOS or Windows, which use
      # the system webview.
      #
      # `libxdo-dev` and the appindicator package are here because the app
      # enables tauri's `tray-icon` feature; without them the bundle step fails
      # at pkg-config, not at apt, which reads like a Rust problem.
      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libxdo-dev \
            librsvg2-dev patchelf

      # `cargo tauri` is not on the runners. The same line `scripts/build-desktop.sh`
      # tells you to run locally when it is missing.
      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      # The gateway serves the UI at `/ui`, so the default build bakes that into
      # every asset URL; Tauri loads the same files from the bundle root, where
      # a `/ui` prefix 404s every stylesheet and script and the window comes up
      # blank. `MOMO_BASE_PATH=none` is the desktop setting.
      #
      # Set here as a step env rather than by calling `npm run build:desktop`:
      # **npm runs package scripts through `cmd` on Windows** no matter which
      # shell the step uses, and cmd reads that script's `MOMO_BASE_PATH= next
      # build` prefix as a command name — "'MOMO_BASE_PATH' is not recognized",
      # which is exactly where the Windows leg failed. An env var needs no shell
      # to agree with it.
      - name: Build the web UI
        working-directory: web
        shell: bash
        env:
          MOMO_BASE_PATH: none
        run: |
          npm ci
          npm run build

      - name: Build momo-fetch
        run: cargo build --release --target ${{ matrix.target }}

      # The shell looks for this next to itself at runtime (`resource_dir`).
      - name: Stage the gateway binary
        shell: bash
        run: |
          mkdir -p desktop/src-tauri/binaries
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp "target/${{ matrix.target }}/release/momo-fetch.exe" desktop/src-tauri/binaries/
          else
            cp "target/${{ matrix.target }}/release/momo-fetch" desktop/src-tauri/binaries/
          fi

      # `--config tauri.ci.conf.json` turns off `beforeBuildCommand`, which
      # rebuilds momo-fetch for the *host* and copies `target/release/momo-fetch`
      # over whatever the step above staged. Right locally, wrong here twice: on
      # the x86_64 macOS job it would replace the cross-built binary with an
      # arm64 one, and on Windows the file it copies is `momo-fetch.exe`, so the
      # command simply fails. The staging step above already knows the target.
      #
      # No TAURI_SIGNING_* here: T13 adds signing. A secret that does not exist
      # arrives as an empty string, and an empty signing key is worse than none —
      # the bundler tries to sign with it and fails. Until the certificates land,
      # the bundles are unsigned: they install and run, but macOS Gatekeeper
      # needs a right-click-Open on first launch and SmartScreen warns on
      # Windows. T11 (auto-update) is blocked on this, since the updater
      # verifies a signature.
      - name: Bundle the desktop app
        working-directory: desktop/src-tauri
        run: cargo tauri build --target ${{ matrix.target }} --config tauri.ci.conf.json

      - uses: actions/upload-artifact@v4
        with:
          name: momo-worker-${{ matrix.target }}
          if-no-files-found: error
          path: |
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
