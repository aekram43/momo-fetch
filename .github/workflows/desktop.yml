name: Desktop build

# T10 — build the desktop app for macOS, Windows and Linux.
#
# The momo-fetch binary is compiled per target and copied into
# desktop/src-tauri/binaries/ so Tauri bundles it as a resource. There is no
# cross-compilation: each OS builds its own, which is also the only way the
# native webview and bundler dependencies work.
#
# Unsigned by design until T13 lands — see the note at the bottom of the job.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target\ndesktop/src-tauri -> target"

      # Tauri's Linux dependencies. Not needed on macOS or Windows, which use
      # the system webview.
      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Build the web UI
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Build momo-fetch
        run: cargo build --release --target ${{ matrix.target }}

      # The shell looks for this next to itself at runtime (`resource_dir`).
      - name: Stage the gateway binary
        shell: bash
        run: |
          mkdir -p desktop/src-tauri/binaries
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp "target/${{ matrix.target }}/release/momo-fetch.exe" desktop/src-tauri/binaries/
          else
            cp "target/${{ matrix.target }}/release/momo-fetch" desktop/src-tauri/binaries/
          fi

      - name: Bundle the desktop app
        working-directory: desktop/src-tauri
        run: cargo tauri build --target ${{ matrix.target }}
        env:
          # T13 will add APPLE_CERTIFICATE / APPLE_SIGNING_IDENTITY /
          # APPLE_ID / APPLE_TEAM_ID here, and the Windows cert alongside.
          # Until then the bundles are unsigned: they install and run, but
          # macOS Gatekeeper needs a right-click-Open on first launch and
          # SmartScreen warns on Windows. T11 (auto-update) is blocked on this
          # because the updater verifies a signature.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - uses: actions/upload-artifact@v4
        with:
          name: momo-worker-${{ matrix.target }}
          if-no-files-found: error
          path: |
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
